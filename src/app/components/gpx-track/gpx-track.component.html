@if (hasTrace()) {
  <div class="flex items-center mt-5 mb-2">
    <div class="full-width-center">
      <span>{{traceUrlObj().name}} - {{totalDistance() | number:'1.2-2'}} KM - {{totalGain() | number:'1.0-0'}} D+</span>
    </div>
  </div>

  <div #mapContainer class="map"></div>
  <div class="elevation-container">
    <canvas #elevationChart></canvas>
  </div>

} @else {
  <div class="empty-state">
    Sélectionnez une trace
  </div>
}
