name: Build, Test & Deploy Angular App

# Trigger workflow on any push to main (or remove 'branches' for all branches)
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up Node.js (Angular requires Node 20)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # 5️⃣ Build Angular app
      - name: Build Angular app
        run: npm run build -- --configuration=production

      # 6️⃣ Deploy via SCP
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "dist/mysportsorganizer/browser"
          target: "/var/www/mysportsorganizer"

      # 7️⃣ Set permissions & reload nginx
      - name: Set permissions & reload nginx
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            sudo chown -R www-data:www-data /var/www/mysportsorganizer
            sudo systemctl reload nginx
